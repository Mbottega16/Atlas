# One combined Render Web Service: FastAPI serves /api/* and also the built
# frontend/dist/ (mounted in app/main.py). NOT deployed yet — needs explicit
# sign-off. ADMIN_PASSWORD must be set in the Render dashboard before first
# boot or the app is wide open.
services:
  - type: web
    name: atlas
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      npm --prefix frontend ci &&
      npm --prefix frontend run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/atlas.db
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false          # set by hand in the dashboard
      - key: ADMIN_SESSION_SECRET
        generateValue: true
